<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Behrad | Portfolio</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-white text-gray-800">
    <!-- Navbar -->
    <header class="w-full border-b border-gray-100">
      <nav
        class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between"
      >
        <a href="#home" class="text-2xl font-bold text-blue-600"> Behrad </a>

        <div class="flex items-center gap-6 text-sm">
          <a href="#about" class="hover:text-blue-600 transition"> About </a>

          <a href="#experience" class="hover:text-blue-600 transition">
            Experience
          </a>

          <a href="#achievements" class="hover:text-blue-600 transition">
            Achievements
          </a>

          <a href="#skills" class="hover:text-blue-600 transition"> Skills </a>

          <a href="#contact" class="hover:text-blue-600 transition">
            Contact
          </a>
        </div>
      </nav>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Hero Section -->
      <section
        id="home"
        class="min-h-[85vh] flex flex-col items-center justify-center text-center px-6"
      >
        <!-- Main Heading -->
        <h1 class="text-4xl md:text-6xl font-bold mb-8">
          Hi, I'm
          <span
            class="bg-gradient-to-r from-purple-500 to-blue-700 bg-clip-text text-transparent"
          >
            Behrad
          </span>
        </h1>

        <!-- Subtitle -->
        <p class="text-gray-600 text-base md:text-xl mb-8">
          Front-End Developer | Web Design Enthusiast
        </p>

        <!-- Contact Button -->
        <a
          href="#contact"
          class="bg-blue-600 text-white px-7 py-3 rounded-lg hover:bg-blue-700 transition duration-300"
        >
          Contact Me
        </a>
      </section>
    </main>
  </body>
</html>
